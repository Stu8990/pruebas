<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>InvestSmart</title>
  <meta name="description" content="Tu cartera de XTB explicada en simple: cómo vas, por qué subiste o bajaste y qué hacer con tu próximo aporte.">
  <link rel="manifest" href="/pruebas/manifest.json">
  <meta name="theme-color" content="#0E3B2E" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1411" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InvestSmart">
  <link rel="icon" href="/pruebas/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/pruebas/icons/apple-touch-icon.svg">
  <!-- Versión exacta + integrity: nada que se publique después bajo el mismo
       rango puede ejecutarse aquí con acceso a la sesión. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"
          integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Schibsted+Grotesk:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-auth="pending">

<!-- ═══════════ Acceso ═══════════ -->
<main id="auth" class="auth" aria-labelledby="auth-title">
  <div class="auth__card">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 32 32" width="36" height="36" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M8 21l6-6 4 4 7-8" fill="none" stroke="var(--on-brand)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand__name">InvestSmart</span>
    </div>
    <h1 id="auth-title" class="auth__title">Tu cartera de XTB, explicada en simple.</h1>
    <p class="auth__lead">Cómo vas, por qué subiste o bajaste y qué hacer con tu próximo aporte.</p>

    <form id="form-login" class="stack" novalidate>
      <label class="field"><span class="field__label">Correo</span>
        <input name="email" type="email" autocomplete="email" inputmode="email" required></label>
      <label class="field"><span class="field__label">Contraseña</span>
        <input name="password" type="password" autocomplete="current-password" required minlength="6"></label>
      <p class="form-msg" role="alert" hidden></p>
      <button class="btn btn--primary btn--block" type="submit">Entrar</button>
      <div class="auth__links">
        <button type="button" class="link" data-action="auth-view" data-view="signup">Crear cuenta</button>
        <button type="button" class="link" data-action="auth-view" data-view="forgot">Olvidé mi contraseña</button>
      </div>
    </form>

    <form id="form-signup" class="stack" novalidate hidden>
      <label class="field"><span class="field__label">Correo</span>
        <input name="email" type="email" autocomplete="email" inputmode="email" required></label>
      <label class="field"><span class="field__label">Contraseña</span>
        <input name="password" type="password" autocomplete="new-password" required minlength="6">
        <span class="field__hint">Mínimo 6 caracteres.</span></label>
      <label class="field"><span class="field__label">Repite la contraseña</span>
        <input name="password2" type="password" autocomplete="new-password" required minlength="6"></label>
      <p class="form-msg" role="alert" hidden></p>
      <button class="btn btn--primary btn--block" type="submit">Crear cuenta</button>
      <div class="auth__links"><button type="button" class="link" data-action="auth-view" data-view="login">Ya tengo cuenta</button></div>
    </form>

    <form id="form-forgot" class="stack" novalidate hidden>
      <p class="muted">Te enviaremos un enlace para crear una contraseña nueva.</p>
      <label class="field"><span class="field__label">Correo</span>
        <input name="email" type="email" autocomplete="email" inputmode="email" required></label>
      <p class="form-msg" role="alert" hidden></p>
      <button class="btn btn--primary btn--block" type="submit">Enviar enlace</button>
      <div class="auth__links"><button type="button" class="link" data-action="auth-view" data-view="login">Volver</button></div>
    </form>
  </div>
</main>

<!-- ═══════════ App ═══════════ -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="brand brand--small">
      <svg class="brand__mark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M8 21l6-6 4 4 7-8" fill="none" stroke="var(--on-brand)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand__name">InvestSmart</span>
    </div>
    <button type="button" class="refresh" data-action="refresh" aria-live="polite">
      <svg class="refresh__icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="refresh-label">Actualizar</span>
    </button>
  </header>

  <nav class="tabs" aria-label="Secciones">
    <a href="#inicio" class="tab" data-tab="inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>Inicio</span></a>
    <a href="#acciones" class="tab" data-tab="acciones">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M7 15v-4M12 15V6M17 15v-7"/></svg>
      <span>Acciones</span></a>
    <a href="#plan" class="tab" data-tab="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      <span>Plan</span></a>
    <a href="#mas" class="tab" data-tab="mas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      <span>Más</span></a>
  </nav>

  <main id="view" class="view" tabindex="-1"></main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="src/app.js"></script>
</body>
</html>
